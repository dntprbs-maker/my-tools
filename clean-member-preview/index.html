<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팀장 대시보드</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-copy">
        <h1>팀장 대시보드</h1>
        <p>김팀장님 환영합니다</p>
      </div>
      <div class="header-actions">
        <span class="notification" aria-label="알림">♢</span>
        <span class="register-button"><b aria-hidden="true">＋</b> 구인등록</span>
        <span class="more-button" aria-label="메뉴">⋮</span>
      </div>
    </header>

    <main class="dashboard-content">
      <section class="filter-area" aria-label="구인 상태 메뉴">
        <nav class="tabs" aria-label="팀장 대시보드 상단 메뉴">
          <span class="tab active">구인중</span>
          <span class="tab">구인마감</span>
          <span class="tab">작업완료</span>
          <span class="tab">취소건</span>
        </nav>
      </section>

      <article class="job-card">
        <div class="job-badges">
          <span class="badge primary">모집중</span>
          <span class="badge">작업일 9월 8일</span>
          <span class="badge">모집 1/2명</span>
        </div>
        <div class="job-description">
          픽업장소 서울시 강남구<br>
          아파트 24평 청소입니다.
        </div>
        <div class="job-footer">
          <p>등록일 2026년 9월 2일 오전 9:30</p>
          <div class="job-actions">
            <span class="edit-button">✎ 수정</span>
            <span class="delete-button">▣ 삭제</span>
          </div>
        </div>
        <div class="applicant-toggle">♙ 지원자 1명⌄</div>
        <div class="applicant">
          <div>
            <strong>홍길동</strong>
            <p>강남구 역삼동 · 010-0000-0000</p>
          </div>
          <span class="applicant-status">대기중</span>
        </div>
      </article>
    </main>
  </div>
</body>
</html>
