<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업 미리보기 - 클린멤버</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="preview">
    <header class="preview-header">
      <p class="eyebrow">UI 작업 미리보기</p>
      <h1>클린멤버 상단 탭</h1>
      <p class="description">스마트폰 화면에서 탭 글씨 크기와 굵기를 확인하는 화면 모형입니다.</p>
    </header>

    <section class="screen" aria-labelledby="leader-title">
      <div class="screen-heading">
        <span class="screen-label">팀장 대시보드</span>
        <h2 id="leader-title">구인 현황</h2>
      </div>
      <nav class="tabs" aria-label="팀장 대시보드 상단 메뉴">
        <span class="tab active">구인중</span>
        <span class="tab">구인마감</span>
        <span class="tab">작업완료</span>
        <span class="tab">취소건</span>
      </nav>
      <div class="placeholder-card">
        <div class="placeholder-line wide"></div>
        <div class="placeholder-line"></div>
        <div class="placeholder-line short"></div>
      </div>
    </section>

    <section class="screen" aria-labelledby="member-title">
      <div class="screen-heading">
        <span class="screen-label">팀원 대시보드</span>
        <h2 id="member-title">지원 현황</h2>
      </div>
      <nav class="tabs" aria-label="팀원 대시보드 상단 메뉴">
        <span class="tab active">구인중</span>
        <span class="tab">지원중</span>
        <span class="tab">수락됨</span>
        <span class="tab">지난 작업</span>
      </nav>
      <div class="placeholder-card">
        <div class="placeholder-line wide"></div>
        <div class="placeholder-line"></div>
        <div class="placeholder-line short"></div>
      </div>
    </section>

    <p class="note">상단 탭 텍스트: 20px · 700</p>
  </main>
</body>
</html>
