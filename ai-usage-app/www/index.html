<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 사용량</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b778c;--line:#dfe6ef;--blue:#1769d2;--green:#22a447}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{padding:10px 10px calc(20px + env(safe-area-inset-bottom));padding-top:calc(10px + env(safe-area-inset-top))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.top h1{font-size:19px;margin:0}
button{font:inherit;cursor:pointer}.btn{border:1px solid #b8c8dc;background:#fff;color:#174f9d;border-radius:10px;padding:9px 13px;font-weight:800;min-height:42px}
.btn.primary{background:#174f9d;color:#fff;border-color:#174f9d}.btn:disabled{opacity:.5}
.status{font-size:12px;color:var(--muted);margin:0 0 8px}
.pace-banner{margin:0 0 8px;padding:11px 12px;border-radius:12px;background:linear-gradient(135deg,#eef6ff,#f5f0ff);border:1px solid #b8c8dc;text-align:center;font-weight:800}
.worker{background:var(--card);border:2px solid #7eb6ff;border-radius:14px;overflow:hidden;margin-bottom:8px}.worker.dex{border-color:#b399ff}
.worker-head{padding:9px 11px;border-bottom:1px solid var(--line);background:#eef6ff;display:flex;justify-content:space-between;align-items:center;gap:8px}.dex .worker-head{background:#f5f0ff}
.worker-head h2{font-size:17px;margin:0}.meta{font-size:11px;color:var(--muted)}
.limit{padding:8px 11px}.limit+.limit{border-top:6px solid var(--bg)}.limit h3{font-size:14px;margin:0 0 4px}
.row{display:grid;grid-template-columns:70px 1fr;align-items:center;min-height:30px;gap:6px;border-bottom:1px solid var(--line)}.label{font-weight:800;font-size:13px}.value{font-size:12px;font-weight:700}
.barwrap{display:flex;align-items:center;gap:6px}.bar{height:14px;flex:1;background:#e5e7eb;border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--blue)}.elapsed .fill{background:var(--green)}.pct{min-width:36px;font-weight:900;font-size:13px}
.box{padding:12px 11px;font-size:14px;line-height:1.5}.err{color:#b42318}
.code{font-size:26px;font-weight:900;letter-spacing:3px;text-align:center;margin:8px 0;user-select:all}
.lrow{display:grid;grid-template-columns:44px 1fr 64px;align-items:center;gap:8px}.lname{font-size:14px}
.lbars{display:flex;flex-direction:column;gap:3px}.lbars .bar{flex:none;height:12px}.lbars .bar.thin{height:6px}
.lnum{text-align:right;line-height:1.1}.lnum b{font-size:17px;display:block}.lnum span{font-size:11px;color:var(--muted)}
.lreset{font-size:11px;color:var(--muted);margin:3px 0 0 52px}
input{width:100%;font:inherit;border:1px solid #cfd8e3;border-radius:10px;padding:10px;margin:6px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>
<main class="app">
  <div class="top"><h1>AI 사용량</h1><button id="refresh" class="btn primary" type="button">↻ 지금 조회</button></div>
  <p id="status" class="status">로그인하면 휴대폰에서 바로 조회합니다.</p>
  <div id="paceBanner"></div>
  <div id="cards"></div>
</main>
<p id="ver" class="status" style="text-align:center"></p>
<script src="version.js"></script>
<script>document.getElementById('ver').textContent = '버전 ' + (window.APP_VERSION || '개발용');</script>
<script src="app.js"></script>
</body>
</html>
