<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 주간 사용량 계산기</title>
<link rel="icon" type="image/png" href="./icon-v2-192.png">
<link rel="apple-touch-icon" href="./icon-v2-512.png">
<link rel="manifest" href="./manifest-v2.webmanifest">
</head>
<body style="margin:0">
<div id="usage-pace-app" class="app-root">
  <style>
    #usage-pace-app{background:light-dark(#f6f8fb,#111418);color:light-dark(#172033,#f3f5f8);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box;border-radius:0}
    #usage-pace-app *{box-sizing:border-box}
    .wrap{max-width:900px;margin:0 auto;overflow:hidden}.ai-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}
    .panel{background:light-dark(#fff,#1b2027);border:1px solid light-dark(#e2e7ee,#303640);border-radius:16px;padding:18px;margin-bottom:16px}
    .inputs{display:grid;grid-template-columns:1fr;gap:10px;min-width:0}.field{min-width:0;overflow:hidden}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;line-height:1.3}.field input{display:block;width:100%;max-width:100%;min-width:0;min-height:42px;border:2px solid light-dark(#ccd4df,#49515d);border-radius:10px;background:light-dark(#fff,#14181d);color:inherit;padding:8px 9px;font-size:14px;line-height:1.2;overflow:hidden;appearance:none;-webkit-appearance:none}.field input:focus{outline:none;box-shadow:0 0 0 3px rgb(37 99 235 / 12%)}.week-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.week-actions button{width:100%;min-width:0;min-height:40px;border:1px solid light-dark(#ccd4df,#49515d);border-radius:10px;background:light-dark(#f3f6fa,#242a32);color:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}.ai-card{min-width:0;padding:12px;border-radius:16px;background:light-dark(#fff,#1b2027);border:3px solid light-dark(#60a5fa,#2563eb);margin-bottom:0;box-shadow:0 4px 12px rgb(37 99 235 / 12%);overflow:hidden}.ai-card:nth-child(even){border-color:light-dark(#a78bfa,#7c3aed);box-shadow:0 4px 12px rgb(124 58 237 / 12%)}.ai-card:nth-child(odd) .field label,.ai-card:nth-child(odd) .metric .value{color:light-dark(#1d4ed8,#93c5fd)}.ai-card:nth-child(even) .field label,.ai-card:nth-child(even) .metric .value{color:light-dark(#6d28d9,#c4b5fd)}.ai-card:nth-child(odd) .field input{border-color:light-dark(#93c5fd,#2563eb)}.ai-card:nth-child(even) .field input{border-color:light-dark(#c4b5fd,#7c3aed)}.ai-card:nth-child(odd) .field input:focus{border-color:light-dark(#2563eb,#60a5fa)}.ai-card:nth-child(even) .field input:focus{border-color:light-dark(#7c3aed,#a78bfa);box-shadow:0 0 0 3px rgb(124 58 237 / 12%)}.ai-card:nth-child(odd) .week-actions button{background:light-dark(#eff6ff,#172554);border-color:light-dark(#bfdbfe,#1d4ed8);color:light-dark(#1d4ed8,#bfdbfe)}.ai-card:nth-child(even) .week-actions button{background:light-dark(#f5f3ff,#2e1065);border-color:light-dark(#ddd6fe,#7c3aed);color:light-dark(#6d28d9,#ddd6fe)}.ai-card:nth-child(even) .planned{background:#7c3aed}.card-tools{display:flex;justify-content:flex-end;margin:-2px 0 7px}
    .delete-btn{border:1px solid light-dark(#fecaca,#7f1d1d);border-radius:8px;background:light-dark(#fff1f2,#3f1518);color:light-dark(#b91c1c,#fecaca);font-size:11px;font-weight:800;padding:5px 9px;cursor:pointer;line-height:1.2}
    .delete-btn:disabled{opacity:.45;cursor:not-allowed}
    .ai-title{font-size:18px;font-weight:800;margin-bottom:12px}.add-btn{width:100%;min-height:46px;margin-top:12px;border:1px dashed light-dark(#60a5fa,#3b82f6);border-radius:12px;background:light-dark(#eff6ff,#172554);color:light-dark(#1d4ed8,#bfdbfe);font-size:15px;font-weight:800;cursor:pointer}
    .status-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px;min-width:0}.metric{min-width:0;padding:12px;border-radius:12px;background:light-dark(#f6f8fb,#15191f);border:1px solid light-dark(#e4e8ee,#2e343d)}.metric .label{font-size:11px;color:light-dark(#697588,#aab3c0);margin-bottom:4px;line-height:1.35}.metric .value{font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.15}.metric .sub{font-size:11px;margin-top:5px;color:light-dark(#738094,#a4adba);line-height:1.35;word-break:keep-all}
    .bar-row{margin-top:10px}.bar-labels{display:flex;justify-content:space-between;gap:6px;font-size:10px;margin-bottom:5px;color:light-dark(#667387,#adb6c4)}.track{height:16px;background:light-dark(#e8edf3,#303640);border-radius:999px;overflow:hidden;position:relative}.planned{position:absolute;left:0;top:0;bottom:0;background:#2563eb;border-radius:999px}
    .error{margin-top:12px;color:light-dark(#b42318,#ffaaa6);font-size:13px;font-weight:650;min-height:20px}
    @media(max-width:640px){#usage-pace-app{padding:8px 6px}.wrap{max-width:none}.ai-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.ai-card{padding:9px 8px;border-radius:14px}.card-tools{margin:-1px 0 6px}.delete-btn{font-size:10px;padding:4px 7px}.inputs{gap:8px}.field label{font-size:11px}.field input{font-size:12px;padding:7px 6px;min-height:40px;border-radius:9px}.field input[type="datetime-local"]{font-size:11px;letter-spacing:-.25px}.week-actions{gap:6px}.week-actions button{font-size:11px;min-height:38px;padding:0 4px;border-radius:9px}.status-grid{gap:7px;margin-top:8px}.metric{padding:9px 8px}.metric .label{font-size:10px}.metric .value{font-size:20px}.metric .sub{font-size:9px}.bar-row{margin-top:8px}.bar-labels{font-size:9px}.bar-labels span:nth-child(2){display:none}.track{height:14px}.add-btn{margin-top:8px;min-height:44px;font-size:14px}}
  </style>
  <div class="wrap">
    <div id="aiList" class="ai-grid"></div>
    <button class="add-btn" id="addAi" type="button">+ AI 추가</button>
  </div>
  <script>
    (()=>{
      const root=document.getElementById('usage-pace-app');
      if(root.dataset.ready)return;root.dataset.ready='1';
      const daily=[15,15,15,15,15,15,10];
      const storageKey='usagePaceAiItems';
      const fmt=n=>`${n.toFixed(1)}%`;
      function localInputValue(date){const p=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`}
      function expectedUsage(start, now){
        const dayMs=86400000; let elapsed=(now-start)/dayMs;
        if(elapsed<=0)return {value:0,elapsed:0,day:1};
        if(elapsed>=7)return {value:100,elapsed:7,day:7};
        let full=Math.floor(elapsed), frac=elapsed-full, value=0;
        for(let i=0;i<full;i++)value+=daily[i];
        value+=daily[full]*frac;
        return {value,elapsed,day:full+1};
      }
      let items=[];
      try{items=JSON.parse(localStorage.getItem(storageKey)||'[]')}catch(e){items=[]}
      if(!Array.isArray(items)||!items.length)items=[{name:'AI 1',expiry:''},{name:'AI 2',expiry:''}];
      const save=()=>localStorage.setItem(storageKey,JSON.stringify(items));
      function render(){
        const list=root.querySelector('#aiList');
        list.innerHTML='';
        items.forEach((item,index)=>{
          const card=document.createElement('section');
          card.className='ai-card';
          card.innerHTML=`<div class="card-tools"><button class="delete-btn" type="button" ${items.length<=1?'disabled':''}>삭제</button></div>
          <div class="inputs">
            <div class="field"><label>이름</label><input class="name-input" type="text" value="${String(item.name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></div>
            <div class="field"><label>주간 사용 한도 만료일시</label><input class="expiry-input" type="datetime-local" value="${item.expiry||''}"></div>
            <div class="week-actions"><button class="prev" type="button">− 1주</button><button class="next" type="button">+ 1주</button></div>
          </div>
          <div class="error" aria-live="polite"></div>
          <div class="status-grid results" hidden>
            <div class="metric"><div class="label">지금까지 계획 사용량 / 잔여량</div><div class="value expected">-</div><div class="sub elapsed">-</div></div>
            <div class="metric"><div class="label">만료까지 남은 시간</div><div class="value remaining-value">-</div><div class="sub remaining">-</div></div>
          </div>
          <div class="bar-row results-bar" hidden><div class="bar-labels"><span>0%</span><span>현재 시점 계획 사용량</span><span>100%</span></div><div class="track"><div class="planned"></div></div></div>`;
          const nameInput=card.querySelector('.name-input'), expiryInput=card.querySelector('.expiry-input');
          function calculate(){
            const error=card.querySelector('.error'), results=card.querySelector('.results'), bar=card.querySelector('.results-bar');
            error.textContent='';
            const exp=new Date(expiryInput.value), now=new Date();
            if(!expiryInput.value||Number.isNaN(exp.getTime())){results.hidden=true;bar.hidden=true;return}
            const start=new Date(exp.getTime()-7*86400000);
            if(now<start){error.textContent='입력한 만료일시는 아직 주간 사용 기간이 시작되기 전입니다.';results.hidden=true;bar.hidden=true;return}
            const data=expectedUsage(start,now), expected=data.value;
            card.querySelector('.expected').textContent=`${fmt(expected)} / ${fmt(100-expected)}`;
            const days=Math.min(7,Math.max(0,data.elapsed));
            card.querySelector('.elapsed').textContent=`주간 기간 ${days.toFixed(2)}일 경과 · ${data.day}일 차`;
            const remainHours=Math.max(0,(exp-now)/3600000);
            card.querySelector('.remaining-value').textContent=remainHours>0?`${(remainHours/24).toFixed(1)}일`:'0일';
            card.querySelector('.remaining').textContent=remainHours>0?`만료까지 약 ${(remainHours/24).toFixed(1)}일 남음`:'현재 주간 기간이 만료됨';
            card.querySelector('.planned').style.width=`${Math.min(100,expected)}%`;
            results.hidden=false;bar.hidden=false;
          }
          function shift(days){if(!expiryInput.value)return;const d=new Date(expiryInput.value);if(Number.isNaN(d.getTime()))return;d.setDate(d.getDate()+days);expiryInput.value=localInputValue(d);items[index].expiry=expiryInput.value;save();calculate()}
          nameInput.addEventListener('input',()=>{items[index].name=nameInput.value;save()});
          expiryInput.addEventListener('input',()=>{items[index].expiry=expiryInput.value;save();calculate()});
          expiryInput.addEventListener('change',()=>{items[index].expiry=expiryInput.value;save();calculate()});
          card.querySelector('.prev').addEventListener('click',()=>shift(-7));
          card.querySelector('.next').addEventListener('click',()=>shift(7));
          card.querySelector('.delete-btn').addEventListener('click',()=>{
            if(items.length<=1)return;
            const label=(items[index].name||`AI ${index+1}`).trim()||`AI ${index+1}`;
            if(!confirm(`${label} 항목을 삭제할까요?`))return;
            items.splice(index,1);
            save();
            render();
          });
          list.appendChild(card);
          calculate();
        });
      }
      root.querySelector('#addAi').addEventListener('click',()=>{items.push({name:`AI ${items.length+1}`,expiry:''});save();render()});
      render();
    })();
  </script>
</div>
</body>
</html>
