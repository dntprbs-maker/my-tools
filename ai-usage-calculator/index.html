<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 주간 사용량 계산기</title>
<style>
body{margin:0;background:#f6f8fb;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
.app{padding:8px;max-width:900px;margin:0 auto}
.ai-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
.inputs{display:grid;grid-template-columns:1fr;gap:10px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.field input{width:100%;min-height:40px;border:1px solid #ccd4df;border-radius:10px;background:#fff;color:inherit;padding:7px;font-size:13px}
.week-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.week-actions button{min-height:38px;border:1px solid #ccd4df;border-radius:10px;background:#f3f6fa;color:inherit;font-size:12px;font-weight:750}
.ai-card{padding:9px;border-radius:14px;background:#fff;border:1px solid #e2e7ee}
.add-btn{width:100%;min-height:42px;margin-top:12px;border:1px dashed #9aa7b8;border-radius:12px;background:transparent;color:inherit;font-size:14px;font-weight:800}
.status-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.metric{padding:9px;border-radius:12px;background:#f6f8fb;border:1px solid #e4e8ee}
.metric .label{font-size:11px;color:#697588;margin-bottom:4px}
.metric .value{font-size:20px;font-weight:800}
.metric .sub{font-size:10px;margin-top:4px;color:#738094}
.bar-row{margin-top:10px}
.bar-labels{display:flex;justify-content:space-between;font-size:10px;margin-bottom:5px;color:#667387}
.bar-labels span:nth-child(2){display:none}
.track{height:16px;background:#e8edf3;border-radius:999px;overflow:hidden;position:relative}
.planned{position:absolute;left:0;top:0;bottom:0;background:#2563eb;border-radius:999px}
.error{margin-top:12px;color:#b42318;font-size:12px;font-weight:650;min-height:16px}
</style>
</head>
<body>
<div class="app">
  <div id="aiList" class="ai-grid"></div>
  <button class="add-btn" id="addAi" type="button">+ AI 추가</button>
</div>

<script>
(()=>{
  const daily=[15,15,15,15,15,15,10];
  const storageKey='usagePaceAiItems';
  const fmt=n=>`${n.toFixed(1)}%`;

  function localInputValue(date){
    const p=n=>String(n).padStart(2,'0');
    return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`;
  }

  function expectedUsage(start, now){
    const dayMs=86400000;
    let elapsed=(now-start)/dayMs;
    if(elapsed<=0)return {value:0,elapsed:0,day:1};
    if(elapsed>=7)return {value:100,elapsed:7,day:7};
    let full=Math.floor(elapsed), frac=elapsed-full, value=0;
    for(let i=0;i<full;i++) value+=daily[i];
    value+=daily[full]*frac;
    return {value,elapsed,day:full+1};
  }

  let items=[];
  try{items=JSON.parse(localStorage.getItem(storageKey)||'[]')}catch(e){items=[]}
  if(!Array.isArray(items)||!items.length)items=[{name:'AI 1',expiry:''},{name:'AI 2',expiry:''}];

  const save=()=>localStorage.setItem(storageKey,JSON.stringify(items));

  function render(){
    const list=document.getElementById('aiList');
    list.innerHTML='';

    items.forEach((item,index)=>{
      const card=document.createElement('section');
      card.className='ai-card';
      card.innerHTML=`
        <div class="inputs">
          <div class="field"><label>이름</label><input class="name-input" type="text" value="${String(item.name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></div>
          <div class="field"><label>주간 사용 한도 만료일시</label><input class="expiry-input" type="datetime-local" value="${item.expiry||''}"></div>
          <div class="week-actions"><button class="prev" type="button">− 1주</button><button class="next" type="button">+ 1주</button></div>
        </div>
        <div class="error"></div>
        <div class="status-grid results" hidden>
          <div class="metric"><div class="label">지금까지 계획 사용량</div><div class="value expected">-</div><div class="sub elapsed">-</div></div>
          <div class="metric"><div class="label">만료까지 남은 시간</div><div class="value remaining-value">-</div><div class="sub remaining">-</div></div>
        </div>
        <div class="bar-row results-bar" hidden>
          <div class="bar-labels"><span>0%</span><span>현재 시점 계획 사용량</span><span>100%</span></div>
          <div class="track"><div class="planned"></div></div>
        </div>`;

      const nameInput=card.querySelector('.name-input');
      const expiryInput=card.querySelector('.expiry-input');

      function calculate(){
        const error=card.querySelector('.error');
        const results=card.querySelector('.results');
        const bar=card.querySelector('.results-bar');
        error.textContent='';

        const exp=new Date(expiryInput.value);
        const now=new Date();

        if(!expiryInput.value||Number.isNaN(exp.getTime())){
          results.hidden=true; bar.hidden=true; return;
        }

        const start=new Date(exp.getTime()-7*86400000);
        if(now<start){
          error.textContent='아직 주간 사용 기간 시작 전입니다.';
          results.hidden=true; bar.hidden=true; return;
        }

        const data=expectedUsage(start,now);
        card.querySelector('.expected').textContent=fmt(data.value);

        const days=Math.min(7,Math.max(0,data.elapsed));
        card.querySelector('.elapsed').textContent=`${days.toFixed(2)}일 경과 · ${data.day}일 차`;

        const remainHours=Math.max(0,(exp-now)/3600000);
        card.querySelector('.remaining-value').textContent=remainHours>0?`${(remainHours/24).toFixed(1)}일`:'0일';
        card.querySelector('.remaining').textContent=remainHours>0?`만료까지 약 ${(remainHours/24).toFixed(1)}일`:'현재 주간 기간 만료';

        card.querySelector('.planned').style.width=`${Math.min(100,data.value)}%`;
        results.hidden=false; bar.hidden=false;
      }

      function shift(days){
        if(!expiryInput.value)return;
        const d=new Date(expiryInput.value);
        if(Number.isNaN(d.getTime()))return;
        d.setDate(d.getDate()+days);
        expiryInput.value=localInputValue(d);
        items[index].expiry=expiryInput.value;
        save();
        calculate();
      }

      nameInput.addEventListener('input',()=>{items[index].name=nameInput.value;save()});
      expiryInput.addEventListener('input',()=>{items[index].expiry=expiryInput.value;save();calculate()});
      expiryInput.addEventListener('change',()=>{items[index].expiry=expiryInput.value;save();calculate()});
      card.querySelector('.prev').addEventListener('click',()=>shift(-7));
      card.querySelector('.next').addEventListener('click',()=>shift(7));

      list.appendChild(card);
      calculate();
    });
  }

  document.getElementById('addAi').addEventListener('click',()=>{
    items.push({name:`AI ${items.length+1}`,expiry:''});
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
