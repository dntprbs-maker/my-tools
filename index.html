<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아빠의 도구 모음</title>
<link rel="icon" type="image/png" href="./ai-usage-calculator/icon-v2-192.png">
<link rel="apple-touch-icon" href="./ai-usage-calculator/icon-v2-512.png">
<link rel="manifest" href="./dashboard-manifest-v1.webmanifest">
<style>
  :root{
    --text:#f7fbff;
    --muted:rgba(255,255,255,.72);
    --glass:rgba(17,30,48,.55);
    --glass-strong:rgba(11,22,37,.78);
    --line:rgba(255,255,255,.14);
    --shadow:0 18px 45px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    overflow:hidden;
    background:
      radial-gradient(circle at 75% 18%,rgba(82,173,255,.35),transparent 27%),
      radial-gradient(circle at 18% 75%,rgba(63,94,251,.26),transparent 30%),
      linear-gradient(135deg,#071525 0%,#12385c 48%,#0b2037 100%);
  }
  body:before{
    content:"";
    position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 0 48%,rgba(255,255,255,.035) 49% 50%,transparent 51% 100%);
  }
  .desktop{
    min-height:100%;
    padding:28px 28px 88px;
    position:relative;
  }
  .heading{
    max-width:720px;
    margin-bottom:30px;
  }
  .heading h1{
    margin:0 0 7px;
    font-size:clamp(25px,3vw,38px);
    letter-spacing:-1.2px;
  }
  .heading p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  .apps{
    display:grid;
    grid-template-columns:repeat(auto-fill,112px);
    gap:18px 14px;
    align-content:start;
  }
  .app{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    min-height:126px;
    padding:12px 8px 10px;
    color:inherit;
    text-decoration:none;
    border:1px solid transparent;
    border-radius:15px;
    transition:.16s ease;
    outline:none;
  }
  .app:hover,.app:focus-visible{
    background:rgba(255,255,255,.09);
    border-color:var(--line);
    transform:translateY(-2px);
  }
  .icon{
    width:66px;height:66px;
    display:grid;place-items:center;
    border-radius:17px;
    font-size:34px;
    background:linear-gradient(145deg,#ffffff,#dcecff);
    box-shadow:0 10px 24px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.8);
  }
  .app-name{
    width:100%;
    text-align:center;
    font-size:12px;
    line-height:1.35;
    font-weight:700;
    text-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .taskbar{
    position:fixed;
    left:12px;right:12px;bottom:12px;
    height:58px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:0 12px;
    background:var(--glass-strong);
    border:1px solid var(--line);
    border-radius:17px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .brand{
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
  }
  .home{
    width:39px;height:39px;
    display:grid;place-items:center;
    border-radius:11px;
    background:rgba(255,255,255,.09);
    border:1px solid var(--line);
    font-size:20px;
  }
  .clock{
    justify-self:end;
    text-align:right;
    line-height:1.2;
  }
  .time{font-size:13px;font-weight:800}
  .date{font-size:10px;color:var(--muted);margin-top:3px}
  @media (max-width:600px){
    body{overflow:auto}
    .desktop{padding:22px 16px 92px}
    .heading{margin-bottom:24px}
    .heading h1{font-size:27px}
    .apps{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }
    .app{
      min-height:132px;
      background:rgba(255,255,255,.055);
      border-color:rgba(255,255,255,.08);
      padding:14px 8px;
    }
    .icon{width:64px;height:64px}
    .app-name{font-size:13px}
    .taskbar{left:8px;right:8px;bottom:8px}
    .brand{font-size:11px}
  }
</style>
</head>
<body>
<main class="desktop">
  <header class="heading">
    <h1>아빠의 도구 모음</h1>
    <p>업무와 개인용으로 사용하는 작은 프로그램을 한곳에서 실행합니다.</p>
  </header>

  <section class="apps" aria-label="프로그램 목록">
    <!-- 새 프로그램은 아래 a.app 블록을 복사해서 추가 -->
    <a class="app" href="./ai-usage-calculator/index.html">
      <div class="icon" aria-hidden="true">📊</div>
      <div class="app-name">AI 주간<br>사용량 계산기</div>
    </a>
    <a class="app" href="./river-view/index.html">
      <div class="icon" aria-hidden="true">🛠️</div>
      <div class="app-name">리버뷰<br>접수 등록</div>
    </a>
  </section>
</main>

<footer class="taskbar">
  <div class="brand">아빠의 도구 모음</div>
  <div class="home" title="홈">⊞</div>
  <div class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">----</div>
  </div>
</footer>

<script>
function updateClock(){
  const now=new Date();
  document.getElementById('time').textContent=
    new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
  document.getElementById('date').textContent=
    new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).format(now);
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
