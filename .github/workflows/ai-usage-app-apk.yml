name: AI 사용량 앱 APK 빌드
# ai-usage-app 폴더가 바뀌면 안드로이드 APK 를 만들고 GitHub Release(ai-usage-app-latest)에 올린다.
# 이 PC에는 안드로이드 개발 도구가 없어서 GitHub 서버에서 빌드한다. APK 에는 비밀정보가 없다.
on:
  push:
    branches: [main]
    paths: ['ai-usage-app/**', '.github/workflows/ai-usage-app-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-usage-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm ci || npm install
      - name: Stamp version
        run: echo "window.APP_VERSION='$(date -u -d '+9 hours' +%m%d.%H%M)-${GITHUB_SHA::7}';" > www/version.js
      - name: Sync web assets into Android project
        run: npx cap sync android
      - name: Restore fixed signing key
        env:
          AIU_KEYSTORE_B64: ${{ secrets.AIU_KEYSTORE_B64 }}
        run: echo "$AIU_KEYSTORE_B64" | base64 -d > android/app/aiusage.p12
      - name: Build debug APK
        working-directory: ai-usage-app/android
        env:
          AIU_KEYSTORE_PASS: ${{ secrets.AIU_KEYSTORE_PASS }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Show signing certificate
        run: $(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep SHA-256
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ai-usage-app.apk
      - name: Publish to release ai-usage-app-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ai-usage-app-latest >/dev/null 2>&1 || gh release create ai-usage-app-latest --title "AI 사용량 앱 (최신)" --notes "휴대폰에서 ai-usage-app.apk 를 받아 설치하세요." --latest=false
          gh release upload ai-usage-app-latest ai-usage-app.apk --clobber
          echo "빌드 커밋: $GITHUB_SHA"
