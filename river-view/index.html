<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리버뷰 접수 관리</title>
<style>
  :root{color-scheme:light;--ink:#172033;--muted:#667085;--line:#d9e0ea;--primary:#1769e0;--primary-dark:#0f55bd;--card:#fff;--bg:#f4f7fb;--success:#087443;--chip:#eef3f9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{width:min(100%,680px);margin:0 auto;padding:18px 14px 32px}
  header{margin-bottom:16px}.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{font-size:25px;letter-spacing:-.6px;margin:0 0 6px}.subtitle{color:var(--muted);font-size:14px;margin:0;line-height:1.5}
  .auth-panel{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.auth-status{font-size:13px;line-height:1.5;color:var(--muted);margin:0}.auth-actions{display:flex;gap:8px;margin-top:11px}.auth-button{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-weight:800;cursor:pointer}.auth-button.primary{margin-top:0;background:var(--primary);border-color:var(--primary);color:#fff}.auth-error{margin-top:9px;color:#b42318;font-size:12px;font-weight:700}.auth-panel[hidden],#appShell[hidden]{display:none}
  .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.nav button{margin:0;background:#fff;color:var(--ink);border:1px solid var(--line);min-height:44px;font-size:14px}.nav button.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgb(23 32 51 / 6%)}
  .field{margin-bottom:15px}.field:last-of-type{margin-bottom:0}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
  input,textarea,select{width:100%;border:1px solid #c5cfdd;border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-size:16px;padding:11px;outline:none}input,select{min-height:46px}textarea{min-height:104px;resize:vertical;line-height:1.5}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgb(23 105 224 / 14%)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}.primary{width:100%;min-height:50px;margin-top:19px;border:0;border-radius:12px;background:var(--primary);color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer}.primary:hover{background:var(--primary-dark)}
  .message{min-height:22px;margin:13px 2px 0;font-size:13px;font-weight:700}.message.success{color:var(--success)}.message.error{color:#b42318}
  .saved{margin-top:16px;padding:13px;border-radius:12px;background:#f0faf5;border:1px solid #b7e2c8}.saved[hidden],.view[hidden]{display:none}.saved-title{font-size:13px;font-weight:800;color:var(--success);margin-bottom:7px}.saved p{margin:4px 0;font-size:13px;line-height:1.45;overflow-wrap:anywhere}
  .list-toolbar{display:grid;gap:11px}.search{position:relative}.search input{padding-left:38px}.search-icon{position:absolute;left:13px;top:12px;color:var(--muted)}
  .filters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.filter{min-height:38px;margin:0;border:1px solid var(--line);border-radius:10px;background:var(--chip);color:var(--ink);font:inherit;font-size:12px;font-weight:800;cursor:pointer}.filter.active{background:#dceaff;border-color:#8cb8f5;color:#0f55bd}
  .list-meta{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px;color:var(--muted);font-size:12px}.list{display:grid;gap:9px}.empty{text-align:center;padding:30px 12px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:13px}
  .record{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;color:var(--ink)}.record:hover,.record:focus-visible{border-color:#8cb8f5;box-shadow:0 0 0 3px rgb(23 105 224 / 10%)}.record-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.record-date{font-size:12px;color:var(--muted)}.badge{border-radius:999px;padding:4px 8px;background:#eef3f9;color:#526173;font-size:11px;font-weight:800;white-space:nowrap}.badge.new{background:#e8f1ff;color:#1769e0}.badge.progress{background:#fff4d8;color:#9a6700}.badge.done{background:#e4f7eb;color:#087443}.record-content{font-size:15px;font-weight:800;line-height:1.4;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.record-vendor{font-size:12px;color:var(--muted);margin-top:8px}.detail{margin-top:14px;padding:15px;border-radius:13px;background:#f7faff;border:1px solid #cfe0f8}.detail h2{font-size:16px;margin:0 0 11px}.detail-row{display:grid;grid-template-columns:76px 1fr;gap:8px;margin:7px 0;font-size:13px;line-height:1.45}.detail-label{color:var(--muted);font-weight:700}.detail-value{white-space:pre-wrap;overflow-wrap:anywhere}.photo-section{margin-top:16px;padding-top:14px;border-top:1px solid #dbe7f5}.photo-title-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.photo-title{font-size:14px;font-weight:800;margin:0}.photo-add{width:auto;min-height:38px;margin:0;padding:0 12px;border:1px solid #8cb8f5;border-radius:9px;background:#e8f1ff;color:#0f55bd;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.photo-help{font-size:12px;color:var(--muted);margin:8px 0 11px;line-height:1.4}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.photo-card{min-width:0;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}.photo-thumb{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#eef3f9;cursor:zoom-in}.photo-placeholder{display:grid;place-items:center;width:100%;aspect-ratio:1;padding:8px;text-align:center;background:#eef3f9;color:var(--muted);font-size:11px;line-height:1.35}.photo-meta{padding:7px}.photo-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.photo-controls{display:grid;grid-template-columns:1fr auto;gap:5px;margin-top:6px}.photo-category{width:100%;min-height:30px;padding:4px;font-size:11px;border-radius:7px}.photo-delete{min-height:30px;margin:0;padding:0 7px;border:1px solid #f0b8b8;border-radius:7px;background:#fff4f4;color:#b42318;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.photo-empty{padding:15px 8px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12px;text-align:center}.photo-dialog{width:min(92vw,560px);max-height:90vh;padding:10px;border:0;border-radius:14px;background:#172033}.photo-dialog::backdrop{background:rgb(0 0 0 / 65%)}.photo-dialog img{display:block;width:100%;max-height:78vh;object-fit:contain}.photo-dialog-close{width:100%;min-height:40px;margin-top:9px;border:1px solid #667085;border-radius:9px;background:#27364d;color:#fff;font:inherit;font-weight:800;cursor:pointer}.detail-divider{border:0;border-top:1px solid #dbe7f5;margin:16px 0 13px}.detail-form-title{font-size:14px;font-weight:800;margin:0 0 10px}.detail-form label{margin-top:10px}.detail-form input,.detail-form textarea,.detail-form select{font-size:14px;padding:9px;min-height:42px}.detail-form textarea{min-height:86px}.detail-save{width:100%;min-height:44px;margin-top:14px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-weight:800;cursor:pointer}.detail-message{min-height:19px;margin:9px 1px 0;font-size:12px;font-weight:700;color:var(--success)}.back-list{width:100%;min-height:40px;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
  .query-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.query-field{margin:0}.query-field.full{grid-column:1/-1}.query-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.query-button,.query-reset{min-height:46px;margin:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}.query-button{border:0;background:var(--primary);color:#fff}.query-reset{border:1px solid var(--line);background:#fff;color:var(--ink)}.query-error{min-height:21px;margin:10px 1px 0;color:#b42318;font-size:13px;font-weight:700}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 12px}.summary-card{padding:10px 5px;text-align:center;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.summary-label{font-size:10px;color:var(--muted);white-space:nowrap}.summary-value{margin-top:4px;font-size:17px;font-weight:800}.summary-cost{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:11px 13px}.query-results{display:grid;gap:8px}.query-result{width:100%;padding:12px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}.query-result:hover,.query-result:focus-visible{border-color:#8cb8f5;box-shadow:0 0 0 3px rgb(23 105 224 / 10%)}.query-result-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.query-result-date,.query-result-process-date{font-size:11px;color:var(--muted)}.query-result-content{margin-top:7px;font-size:14px;font-weight:800;line-height:1.4}.query-result-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px;font-size:11px;color:var(--muted)}.query-empty{text-align:center;padding:25px 10px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px}
  @media (max-width:420px){main{padding:15px 11px 28px}h1{font-size:23px}.panel{padding:14px}.filters{gap:4px}.filter{font-size:11px;padding:0 2px}.detail-row{grid-template-columns:70px 1fr}.query-grid{gap:9px}.query-field.full{grid-column:1/-1}.summary{gap:4px}.summary-value{font-size:15px}.summary-label{font-size:9px}}
</style>
</head>
<body>
<main>
  <header><div class="title-row"><div><h1>리버뷰 접수 관리</h1><p class="subtitle">유지보수 요청을 등록하고 접수 현황을 확인합니다.</p></div></div></header>
  <section id="authPanel" class="auth-panel" aria-live="polite"><p id="authStatus" class="auth-status">인증 상태를 확인하는 중입니다…</p><div class="auth-actions"><button id="loginButton" class="auth-button primary" type="button" hidden>Google로 로그인</button><button id="logoutButton" class="auth-button" type="button" hidden>로그아웃</button></div><div id="authError" class="auth-error" role="alert"></div></section>
  <div id="appShell" hidden>
  <nav class="nav" aria-label="화면 선택"><button type="button" id="showList" class="active">접수 목록</button><button type="button" id="showForm">접수 등록</button><button type="button" id="showQuery">조회</button></nav>

  <section id="listView" class="view">
    <div class="panel">
      <div class="list-toolbar">
        <label class="search" aria-label="접수 검색"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="접수내용 또는 담당업체 검색"></label>
        <div class="filters" role="group" aria-label="접수 상태 필터"><button class="filter active" data-status="전체" type="button">전체</button><button class="filter" data-status="신규" type="button">신규</button><button class="filter" data-status="처리중" type="button">처리중</button><button class="filter" data-status="완료" type="button">완료</button></div>
      </div>
      <div class="list-meta"><strong id="listCount">0건</strong><span>접수를 누르면 상세 내용을 확인합니다.</span></div>
      <div id="recordList" class="list" aria-live="polite"></div>
      <section id="detail" class="detail" hidden></section>
    </div>
  </section>

  <section id="formView" class="view" hidden>
    <form class="panel" id="intakeForm" novalidate>
      <div class="field"><label for="receivedAt">접수일시</label><input id="receivedAt" name="receivedAt" type="datetime-local" required></div>
      <div class="field"><label for="content">접수내용</label><textarea id="content" name="content" placeholder="요청받은 유지보수 내용을 입력하세요." required></textarea></div>
      <div class="field"><label for="vendor">담당업체</label><select id="vendor" name="vendor"><option value="미정">미정</option><option value="직접 처리">직접 처리</option><option value="외주업체">외주업체</option></select><div class="hint">담당업체가 정해지지 않은 접수도 저장할 수 있습니다.</div></div>
      <div class="field"><label for="memo">기타 메모</label><textarea id="memo" name="memo" placeholder="추가로 남길 내용을 입력하세요."></textarea></div>
      <button class="primary" type="submit">접수 저장</button><div id="message" class="message" role="status" aria-live="polite"></div>
      <section id="saved" class="saved" hidden><div class="saved-title">저장된 접수</div><p><strong>접수일시</strong> <span id="savedAt"></span></p><p><strong>접수내용</strong> <span id="savedContent"></span></p><p><strong>담당업체</strong> <span id="savedVendor"></span></p><p><strong>기타 메모</strong> <span id="savedMemo"></span></p></section>
    </form>
  </section>
  <section id="queryView" class="view" hidden>
    <div class="panel">
      <h2 class="detail-form-title">접수 조회·집계</h2>
      <div class="query-grid">
        <label class="query-field">검색 기준<select id="queryBasis"><option value="received">접수일</option><option value="processed">처리일</option></select></label>
        <label class="query-field">상태<select id="queryStatus"><option value="전체">전체</option><option value="신규">신규</option><option value="처리중">처리중</option><option value="완료">완료</option></select></label>
        <label class="query-field">시작일<input id="queryStart" type="date"></label>
        <label class="query-field">종료일<input id="queryEnd" type="date"></label>
        <label class="query-field">담당업체<select id="queryVendor"><option value="전체">전체</option><option value="미정">미정</option><option value="직접 처리">직접 처리</option><option value="외주업체">외주업체</option></select></label>
        <label class="query-field full">검색어<input id="queryText" type="search" placeholder="접수내용·처리내용·메모·담당업체"></label>
      </div>
      <div id="queryError" class="query-error" role="alert" aria-live="polite"></div>
      <div class="query-actions"><button id="runQuery" class="query-button" type="button">조회</button><button id="resetQuery" class="query-reset" type="button">조건 초기화</button></div>
      <div class="summary" aria-label="조회 요약"><div class="summary-card"><div class="summary-label">전체</div><div id="sumTotal" class="summary-value">0</div></div><div class="summary-card"><div class="summary-label">신규</div><div id="sumNew" class="summary-value">0</div></div><div class="summary-card"><div class="summary-label">처리중</div><div id="sumProgress" class="summary-value">0</div></div><div class="summary-card"><div class="summary-label">완료</div><div id="sumDone" class="summary-value">0</div></div><div class="summary-card"><div class="summary-label">비용</div><div id="sumCost" class="summary-value">0원</div></div></div>
      <div id="queryResults" class="query-results" aria-live="polite"></div>
    </div>
  </section>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
(() => {
  const apiUrl = '/api/river-view';
  const auth = firebase.initializeApp(window.riverViewFirebaseConfig).auth();
  const googleProvider = new firebase.auth.GoogleAuthProvider();
  googleProvider.setCustomParameters({ prompt: 'select_account' });
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(error => { console.error('Firebase Auth persistence error', error.code, error.message); });
  const allowedEmail = 'dntprbs@gmail.com';
  const photoKey = 'riverViewPhotos';
  const photoFiles = new Map();
  const previewUrls = new Set();
  const clearPreviewUrls = () => { previewUrls.forEach(url => URL.revokeObjectURL(url)); previewUrls.clear(); };
  const listView = document.getElementById('listView');
  const formView = document.getElementById('formView');
  const listButton = document.getElementById('showList');
  const formButton = document.getElementById('showForm');
  const queryButton = document.getElementById('showQuery');
  const queryView = document.getElementById('queryView');
  const queryBasis = document.getElementById('queryBasis');
  const queryStatus = document.getElementById('queryStatus');
  const queryStart = document.getElementById('queryStart');
  const queryEnd = document.getElementById('queryEnd');
  const queryVendor = document.getElementById('queryVendor');
  const queryText = document.getElementById('queryText');
  const queryError = document.getElementById('queryError');
  const queryResults = document.getElementById('queryResults');
  const list = document.getElementById('recordList');
  const detail = document.getElementById('detail');
  const search = document.getElementById('search');
  const count = document.getElementById('listCount');
  const receivedAt = document.getElementById('receivedAt');
  const content = document.getElementById('content');
  const vendor = document.getElementById('vendor');
  const memo = document.getElementById('memo');
  const message = document.getElementById('message');
  const saved = document.getElementById('saved');
  const authPanel = document.getElementById('authPanel');
  const appShell = document.getElementById('appShell');
  const authStatus = document.getElementById('authStatus');
  const authError = document.getElementById('authError');
  const loginButton = document.getElementById('loginButton');
  const logoutButton = document.getElementById('logoutButton');
  const pad = value => String(value).padStart(2, '0');
  const localDateTime = date => `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  const formatDate = value => value ? value.replace('T', ' ') : '일시 없음';
  let records = [];
  let recordsReady = false;
  let recordsError = '';
  let photos = (() => { try { const parsed = JSON.parse(localStorage.getItem(photoKey) || '[]'); return Array.isArray(parsed) ? parsed : []; } catch (error) { return []; } })();
  let activeStatus = '전체';
  const savePhotos = () => localStorage.setItem(photoKey, JSON.stringify(photos));
  const apiRequest = async (method, body) => { if (!auth.currentUser) throw new Error('로그인이 필요합니다.'); const token = await auth.currentUser.getIdToken(); const headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }; const response = await fetch(apiUrl, { method, headers, body: body ? JSON.stringify(body) : undefined }); const data = await response.json().catch(() => ({})); if (response.status === 401) throw new Error('인증이 만료되었거나 유효하지 않습니다. 다시 로그인해 주세요.'); if (response.status === 403) throw new Error('허용되지 않은 계정입니다.'); if (!response.ok) throw new Error(data.error || `요청 실패 (${response.status})`); return data; };
  const loadRecords = async () => { recordsReady = false; recordsError = ''; renderList(); try { const data = await apiRequest('GET'); records = Array.isArray(data.jobs) ? data.jobs.sort((a, b) => String(b.receivedAt || '').localeCompare(String(a.receivedAt || ''))) : []; recordsReady = true; renderList(); if (!queryView.hidden) renderQuery(); } catch (error) { recordsError = error.message; renderList(); if (!queryView.hidden) renderQuery(); } };
  const setView = name => { clearPreviewUrls(); const isList = name === 'list'; const isForm = name === 'form'; listView.hidden = !isList; formView.hidden = !isForm; queryView.hidden = name !== 'query'; listButton.classList.toggle('active', isList); formButton.classList.toggle('active', isForm); queryButton.classList.toggle('active', name === 'query'); if (isList) renderList(); if (name === 'query') renderQuery(); };
  const make = (tag, className, text) => { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; };
  function renderPhotos(record) {
    const section = make('section', 'photo-section');
    const titleRow = make('div', 'photo-title-row'); titleRow.append(make('h3', 'photo-title', '작업 사진'));
    const addButton = make('button', 'photo-add', '+ 사진 추가'); addButton.type = 'button'; titleRow.append(addButton); section.append(titleRow);
    section.append(make('p', 'photo-help', '여러 장을 선택할 수 있으며, 사진 원본은 이번 단계에서 브라우저 메모리에만 유지됩니다.'));
    const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.multiple = true; input.hidden = true; input.setAttribute('aria-label', '작업 사진 파일 선택'); addButton.addEventListener('click', () => input.click()); section.append(input);
    const grid = make('div', 'photo-grid'); const ownPhotos = photos.filter(photo => photo.recordId === record.id);
    if (!ownPhotos.length) grid.append(make('div', 'photo-empty', '아직 등록된 작업 사진이 없습니다.'));
    ownPhotos.forEach(photo => {

      if (file) { previewUrl = URL.createObjectURL(file); previewUrls.add(previewUrl); const image = make('img', 'photo-thumb'); image.src = previewUrl; image.alt = `${photo.name} 미리보기`; image.addEventListener('click', () => { const dialog = make('dialog', 'photo-dialog'); const large = make('img'); large.src = previewUrl; large.alt = `${photo.name} 확대`; const close = make('button', 'photo-dialog-close', '닫기'); close.type = 'button'; close.addEventListener('click', () => { dialog.close(); dialog.remove(); }); dialog.append(large, close); document.body.append(dialog); dialog.showModal(); }); card.append(image); } else card.append(make('div', 'photo-placeholder', '새로고침 후에는\n미리보기가 사라집니다.'));
